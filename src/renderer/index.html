<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data: blob:" />
  <title>Forge</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* Boot splash for phones and tablets only (a desktop window draws before it could be seen): the wordmark with a soft sheen, removed once the app has drawn. */
    #boot { display: none; }
    @media (hover: none) and (pointer: coarse) {
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; gap: 10px; background: #141414; color: #d6d6d6; font: 650 24px/1 'Geist Variable', ui-sans-serif, -apple-system, system-ui, sans-serif; letter-spacing: -.03em; }
      #boot i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: #e6e6e6; color: #141414; font: italic 700 20px/1 Georgia, serif; }
      #boot span { position: relative; overflow: hidden; padding: 4px 2px; }
      #boot span::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .16), transparent); animation: boot-sheen 1.4s ease-in-out infinite; }
      @media (prefers-color-scheme: light) { #boot { background: #fbfbfa; color: #1c1c1e; } #boot i { background: #1c1c1e; color: #fbfbfa; } #boot span::after { background: linear-gradient(90deg, transparent, rgba(0, 0, 0, .08), transparent); } }
      @media (prefers-reduced-motion: reduce) { #boot span::after { animation: none; } }
    }
    @keyframes boot-sheen { to { transform: translateX(100%); } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><i>f</i><span>forge</span></div>
  <div id="app">
    <aside id="history" aria-label="Chats and navigation">
      <div class="brand"><span class="brand-mark" aria-hidden="true">f</span><strong>forge</strong><span class="grow"></span><button class="icon-btn sm" id="side-collapse" title="Hide sidebar (Ctrl B)" aria-label="Hide sidebar"><i data-icon="sidebar" class="sm"></i></button></div>
      <nav class="side-nav" aria-label="Main">
        <button class="side-btn command-trigger" id="commands" title="Find anything (Ctrl K)"><i data-icon="search"></i><span>Find anything</span><kbd>Ctrl K</kbd></button>
        <button class="side-btn new-chat" id="new-chat" title="New Solo chat (Ctrl N)"><i data-icon="edit"></i><span data-name="newChat">New Solo chat</span><kbd>Ctrl N</kbd></button>
        <button class="side-btn team-nav" id="team-nav" hidden title="Crew runs"><i data-icon="users"></i><span data-name="crewRuns">Crew runs</span></button>
      </nav>
      <div class="side-label"><span data-name="chats">Chats</span><button class="icon-btn xs" id="side-new" title="New Solo chat" aria-label="New Solo chat"><i data-icon="plus" class="sm"></i></button></div>
      <input id="chat-search" type="search" aria-label="Filter chats" placeholder="Filter chats" autocomplete="off" />
      <div id="chat-list"></div>
      <div class="side-foot">
        <button class="usage-badge" id="usage-badge" title="Token usage" aria-label="Token usage"><span class="avatar" aria-hidden="true"><i data-icon="coin" class="sm"></i></span><span class="u-main">0</span><span class="u-sub"></span></button>
        <button class="icon-btn" id="models-btn" title="Model library" aria-label="Model library"><i data-icon="cube"></i></button>
        <button class="icon-btn" id="gear" title="Settings (Ctrl ,)" aria-label="Settings"><i data-icon="gear"></i></button>
      </div>
    </aside>

    <main id="chat">
      <header id="chat-head">
        <button class="icon-btn" id="hist-toggle" title="Show or hide chat history (Ctrl B)" aria-label="Toggle chat history"><i data-icon="sidebar" class="no-phone"></i><i data-icon="menu" class="phone-only"></i></button>
        <button id="chat-title" title="Click to rename">New chat</button>
        <span class="grow"></span>
        <span class="chip" id="rate" hidden title="Generation speed"></span>
        <span class="chip" id="ctx" hidden title="How much of the model's memory this chat uses"></span>
        <button class="head-btn" id="brief-toggle" aria-expanded="false" aria-controls="build-brief" title="Build brief (Ctrl .)" aria-label="Build brief"><i data-icon="list"></i></button>
        <button class="head-btn" id="ws-toggle" title="Workspace: files, editor and terminal (Ctrl J)" aria-label="Workspace"><i data-icon="code"></i></button>
        <button class="icon-btn" id="more" title="More" aria-label="More"><i data-icon="dots"></i></button>
      </header>
      <div id="thread-wrap"><div id="thread-scroll"><div id="thread"></div></div><button id="to-bottom" hidden title="Jump to the latest message" aria-label="Jump to the latest message"><i data-icon="arrowdown"></i></button></div>
      <div id="composer-wrap">
        <div id="composer">
          <div class="composer-modes" role="group" aria-label="Build mode"><button id="mode-chat" class="composer-mode active" type="button" title="Solo: one agent"><span data-name="solo">Solo</span></button><button id="mode-team" class="composer-mode" type="button" hidden title="Crew: several agents together"><span data-name="crew">Crew</span></button></div>
          <textarea id="prompt" rows="1" aria-label="Describe what to build" placeholder="Describe what you want to build"></textarea>
          <div class="bar">
            <button class="pill" id="project" title="The folder the agent works in">Choose folder</button>
            <select aria-label="Agent autonomy" id="mode" title="How much the agent may do without asking">
              <option value="ask-all">Ask before edits</option>
              <option value="auto-edit">Auto-edit</option>
              <option value="full-auto">Full auto</option>
            </select>
            <select aria-label="AI model" id="model" title="Model"></select>
            <button class="pill multi" id="multi" type="button" aria-pressed="false" title="Run what you type with several agents at once (the Crew), not just one" hidden><i data-icon="users"></i><span>Many agents</span></button>
            <span class="grow"></span>
            <button id="send" title="Send" aria-label="Send"><i data-icon="arrowup"></i></button>
          </div>
        </div>
        <div class="composer-note"><span id="model-honesty">Checking model availability…</span><span title="Enter sends, Shift+Enter adds a new line">↵ send · ⇧↵ new line</span></div>
      </div>
      <aside id="build-brief" aria-label="What we’re building">
        <div class="brief-top"><span class="eyebrow">Build brief</span><button id="brief-close" class="icon-btn" aria-label="Close build brief" title="Close"><i data-icon="x"></i></button></div>
        <div class="project-object"><div class="object-icon"><i data-icon="cube"></i></div><h2 id="brief-name">Your next idea</h2><p id="brief-folder"></p><p id="brief-goal"></p></div>
        <div id="brief-status" role="status">Ready when you are</div>
        <section class="brief-section" id="agent-plan-section" hidden><h3>Plan</h3><ol id="agent-plan"></ol></section>
        <section class="brief-section"><div class="brief-section-head"><h3>Priorities</h3><span id="priority-count" title="Priorities included in the next message">0</span></div><p class="brief-muted">Sent with your next message, in order.</p><ol id="priorities"></ol><form id="priority-form"><input id="priority-input" aria-label="New build priority" placeholder="Add a priority" maxlength="240"/><button class="icon-btn sm" type="submit" aria-label="Add priority" title="Add priority"><i data-icon="plus" class="sm"></i></button></form></section>
        <section class="brief-section"><h3 id="brief-files-title">Taking shape</h3><div id="brief-files"></div><button id="brief-preview" class="btn" hidden>Open preview</button></section>
        <div class="brief-foot">Stays on your computer</div>
      </aside>
    </main>

    <main id="team-screen" hidden aria-label="Crew">
      <header class="team-head">
        <button class="icon-btn" id="team-hist-toggle" aria-label="Toggle navigation" title="Show or hide the sidebar"><i data-icon="sidebar" class="no-phone"></i><i data-icon="menu" class="phone-only"></i></button>
        <h1 class="page-title" data-name="crew">Crew</h1>
        <span class="grow"></span>
        <button class="btn" id="team-back" title="Back to Solo"><i data-icon="arrowleft" class="sm"></i><span data-name="backToSolo">Back to Solo</span></button>
      </header>
      <div id="team-root"></div>
    </main>

    <div id="scrim" hidden></div>
    <aside id="workspace">
      <div id="side"><div id="tree"></div></div>
      <div id="main"><div id="tabs"></div><div id="editor"></div><div id="term"></div></div>
    </aside>
  </div>
  <div id="menu" class="menu" hidden></div>
  <div id="toasts"></div>
  <dialog id="palette" aria-label="Find anything"><div class="palette-search"><i data-icon="search"></i><input id="command-search" role="combobox" aria-label="Search actions, chats, and models" aria-controls="command-results" aria-expanded="true" aria-autocomplete="list" placeholder="Where do you want to go?" autocomplete="off"/><kbd>Esc</kbd></div><div id="command-results" role="listbox" aria-label="Commands"></div><div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>↵</kbd> open</span><span id="command-count"></span></div></dialog>
  <dialog id="settings" aria-label="Settings"></dialog>
  <dialog id="library" aria-label="Model library"></dialog>
  <script type="module" src="./main.ts"></script>
</body>
</html>
