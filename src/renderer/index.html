<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data:" />
  <title>Forge</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <aside id="history">
      <button class="new-chat" id="new-chat"><i data-icon="plus"></i><span>New chat</span><kbd>Ctrl N</kbd></button>
      <input id="chat-search" type="search" placeholder="Search chats…" autocomplete="off" />
      <div id="chat-list"></div>
      <button class="usage-badge" id="usage-badge" title="Token usage"><span class="u-main">0 tokens</span><span class="u-sub">no usage yet</span></button>
      <button class="side-btn" id="models-btn"><i data-icon="cube"></i>Models</button>
      <button class="side-btn" id="gear"><i data-icon="sliders"></i>Settings</button>
    </aside>

    <main id="chat">
      <header id="chat-head">
        <button class="icon-btn" id="hist-toggle" title="Show or hide chat history (Ctrl B)" aria-label="Toggle chat history"><i data-icon="sidebar"></i></button>
        <span id="chat-title" title="Click to rename">New chat</span>
        <span class="grow"></span>
        <span class="chip" id="rate" hidden title="Generation speed"></span>
        <span class="chip" id="ctx" hidden title="How much of the model's memory this chat uses"></span>
        <button class="head-btn" id="ws-toggle" title="Show the files, editor and terminal (Ctrl J)"><i data-icon="code"></i>Workspace</button>
        <button class="icon-btn" id="more" title="More" aria-label="More"><i data-icon="dots"></i></button>
      </header>
      <div id="thread-wrap"><div id="thread-scroll"><div id="thread"></div></div><button id="to-bottom" hidden title="Jump to the latest message" aria-label="Jump to the latest message"><i data-icon="arrowdown"></i></button></div>
      <div id="composer-wrap">
        <div id="composer">
          <textarea id="prompt" rows="1" placeholder="Ask Forge to build or change something…"></textarea>
          <div class="bar">
            <button class="pill" id="project" title="The folder the agent works in">Choose folder</button>
            <select id="mode" title="How much the agent may do without asking">
              <option value="ask-all">Ask before edits</option>
              <option value="auto-edit">Auto-edit</option>
              <option value="full-auto">Full auto</option>
            </select>
            <select id="model" title="Model"></select>
            <span class="grow"></span>
            <button id="send" title="Send" aria-label="Send"><i data-icon="arrowup"></i></button>
          </div>
        </div>
      </div>
    </main>

    <aside id="workspace">
      <div id="side"><div id="tree"></div></div>
      <div id="main"><div id="tabs"></div><div id="editor"></div><div id="term"></div></div>
    </aside>
  </div>
  <div id="menu" class="menu" hidden></div>
  <div id="toasts"></div>
  <dialog id="settings"></dialog>
  <dialog id="library"></dialog>
  <script type="module" src="./main.ts"></script>
</body>
</html>
