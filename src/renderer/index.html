<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:" />
  <title>Forge</title>
  <style>
    :root {
      --bg: #18181b; --panel: #1e1e22; --panel-2: #26262b; --border: #2e2e34;
      --text: #e6e6ea; --muted: #8d8d97; --accent: #8b9cff; --accent-ink: #12131a;
      --add: #1f3a2a; --add-ink: #7ee2a1; --del: #43232a; --del-ink: #ff9aa6; --err: #ff8a8a;
      --mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, -apple-system, 'Segoe UI', Inter, sans-serif; }
    button, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    #app { display: grid; grid-template-columns: clamp(140px, 15vw, 240px) minmax(0, 1fr) clamp(300px, 32vw, 420px); height: 100%; }

    /* sidebar */
    #side { background: var(--panel); border-right: 1px solid var(--border); overflow: auto; padding: 10px 0; }
    #side .open { margin: 2px 12px 10px; padding: 6px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; }
    #side .open:hover { border-color: var(--accent); }
    .row { padding: 2px 12px; cursor: pointer; white-space: nowrap; user-select: none; color: #c9c9d0; }
    .row:hover { background: var(--panel-2); }

    /* editor column */
    #main { display: grid; grid-template-rows: 36px minmax(0, 1fr) 220px; min-width: 0; }
    #tabs { display: flex; background: var(--panel); overflow-x: auto; border-bottom: 1px solid var(--border); }
    .tab { padding: 0 14px; line-height: 36px; cursor: pointer; border-right: 1px solid var(--border); white-space: nowrap; color: var(--muted); }
    .tab.active { background: var(--bg); color: var(--text); box-shadow: inset 0 -2px var(--accent); }
    #editor { min-height: 0; }
    #term { border-top: 1px solid var(--border); padding: 6px 0 0 10px; min-height: 0; overflow: hidden; background: #1e1e1e; }

    /* chat */
    #chat { display: grid; grid-template-rows: 44px minmax(0, 1fr) auto; background: var(--panel); border-left: 1px solid var(--border); min-width: 0; }
    #chat header { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .icon-btn { background: none; border: 0; border-radius: 6px; color: var(--muted); width: 28px; height: 28px; font-size: 16px; }
    .icon-btn:hover { background: var(--panel-2); color: var(--text); }
    #thread { overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }

    .empty { margin: auto 0; text-align: center; color: var(--muted); }
    .empty h2 { margin: 0 0 6px; font-size: 18px; color: var(--text); font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .chip { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; color: var(--text); }
    .chip:hover { border-color: var(--accent); }

    .user { align-self: flex-end; max-width: 88%; background: var(--panel-2); border-radius: 14px 14px 4px 14px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
    .assistant { word-break: break-word; }
    .assistant p, .assistant ul { margin: 0 0 8px; }
    .assistant p:last-child, .assistant ul:last-child { margin-bottom: 0; }
    .assistant ul { padding-left: 20px; }
    .assistant code { font: 12px var(--mono); background: var(--panel-2); border-radius: 4px; padding: 1px 5px; }
    .assistant pre { margin: 8px 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
    .assistant pre code { background: none; padding: 0; }

    .tool { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); overflow: hidden; }
    .tool-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; background: none; border: 0; text-align: left; }
    .tool-head:hover { background: var(--panel-2); }
    .tool-label { color: var(--muted); }
    .tool-path { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
    .dot.run { background: none; border: 2px solid var(--accent); border-top-color: transparent; width: 10px; height: 10px; animation: spin .8s linear infinite; }
    .dot.ok { background: #5bd18a; } .dot.err { background: var(--err); } .dot.wait { background: #f0c05a; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tool-body { border-top: 1px solid var(--border); font: 12px var(--mono); max-height: 260px; overflow: auto; }
    .tool-body pre { margin: 0; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
    .tool-body .err { color: var(--err); }
    .ln { padding: 0 10px; white-space: pre-wrap; word-break: break-word; }
    .ln.add { background: var(--add); color: var(--add-ink); } .ln.del { background: var(--del); color: var(--del-ink); }
    .ln.more { color: var(--muted); }
    .approve { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--border); }
    .approve button { border-radius: 8px; padding: 4px 14px; border: 1px solid var(--border); background: var(--panel-2); }
    .approve .yes { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

    .note { color: var(--muted); font-size: 12px; }
    .changes { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); overflow: hidden; }
    .changes-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
    .changes-head .stat { font: 12px var(--mono); flex: 1; }
    .plus { color: var(--add-ink); } .minus { color: var(--del-ink); }
    .undo { border-radius: 8px; padding: 3px 12px; border: 1px solid var(--border); background: var(--panel-2); }
    .undo:hover:not(:disabled) { border-color: var(--accent); }
    .file-row { display: flex; gap: 8px; align-items: center; width: 100%; padding: 3px 10px; background: none; border: 0; border-top: 1px solid var(--border); text-align: left; }
    .file-row:hover { background: var(--panel-2); }
    .file-status { font: 600 11px var(--mono); width: 14px; color: var(--muted); }
    .file-status.added { color: var(--add-ink); } .file-status.deleted { color: var(--del-ink); }
    .changes-done { padding: 8px 10px; }
    .errtext { color: var(--err); font-size: 12px; }
    dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(460px, 92vw); }
    dialog::backdrop { background: rgba(0, 0, 0, .55); }
    .dlg { padding: 18px 20px 14px; display: grid; gap: 10px; }
    .dlg h3 { margin: 0; font-size: 15px; }
    .dlg p { margin: 0; }
    .keyrow { display: grid; grid-template-columns: 90px 1fr auto auto; gap: 8px; align-items: center; margin-top: 6px; }
    .keyrow label { color: var(--muted); }
    .dlg input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--text); min-width: 0; width: 100%; }
    .dlg input:focus { outline: 0; border-color: var(--accent); }
    .dlg button { border-radius: 8px; padding: 5px 12px; border: 1px solid var(--border); background: var(--panel-2); }
    .dlg .close { justify-self: end; margin-top: 6px; }
    .modelrow { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; }
    .errcard { border: 1px solid #5a2e33; background: #2a1a1d; color: var(--err); border-radius: 10px; padding: 8px 12px; }

    #composer { margin: 8px 12px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 10px 10px 8px; }
    #composer:focus-within { border-color: var(--accent); }
    #prompt { width: 100%; background: none; border: 0; outline: 0; resize: none; max-height: 180px; padding: 2px 4px; }
    #prompt::placeholder { color: var(--muted); }
    .bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .bar select { background: none; border: 0; color: var(--muted); border-radius: 6px; padding: 3px 4px; max-width: 150px; }
    .bar select:hover { background: var(--panel-2); color: var(--text); }
    .bar select option { background: var(--panel); color: var(--text); }
    .grow { flex: 1; }
    #send { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 700; }
    #send:disabled { background: var(--panel-2); color: var(--muted); cursor: default; }
    #send.stop { background: var(--text); }
  </style>
</head>
<body>
  <div id="app">
    <div id="side"><button class="open" id="open">Open folder</button><div id="tree"></div></div>
    <div id="main"><div id="tabs"></div><div id="editor"></div><div id="term"></div></div>
    <aside id="chat">
      <header><span>Agent</span><span><button class="icon-btn" id="gear" title="API keys">⚙</button><button class="icon-btn" id="new" title="New chat">＋</button></span></header>
      <div id="thread"></div>
      <div id="composer">
        <textarea id="prompt" rows="1" placeholder="Ask Forge to change your code…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="bar">
          <select id="mode" title="How much the agent may do without asking">
            <option value="ask-all">Ask before edits</option>
            <option value="auto-edit">Auto-edit</option>
            <option value="full-auto">Full auto</option>
          </select>
          <select id="model" title="Model"></select>
          <span class="grow"></span>
          <button id="send" title="Send">↑</button>
        </div>
      </div>
    </aside>
  </div>
  <dialog id="settings"></dialog>
  <script type="module" src="./main.ts"></script>
</body>
</html>
